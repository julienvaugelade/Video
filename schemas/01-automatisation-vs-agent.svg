<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Automatisation versus agent IA</title>
<desc id="d">Comparaison côte à côte : une automatisation suit un chemin linéaire déclencheur, action, fin ; un agent tourne en boucle observer, décider, agir, vérifier jusqu'à atteindre son objectif.</desc>
