<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">La boucle de l'agent</title>
<desc id="d">Le cycle observer, décider, agir, vérifier représenté en cercle, avec quatre garde-fous placés aux points de sortie de la boucle : filtrage des entrées, validation avant action, plafond d'itérations, critère d'objectif atteint.</desc>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#4E4EEA"/></marker><marker id="a-yel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#E0AA00"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#1C1C2E"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#7A7A8C"/></marker><marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#E5484D"/></marker><marker id="a-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#2F2FB5"/></marker></defs>
<rect width="1200" height="700" fill="#FBFBF8"/>
<rect x="40" y="28" width="36.4" height="26" rx="13.0" fill="#1C1C2E" stroke="none" stroke-width="0" />
<text x="58.2" y="45.2" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" >M5</text>
<text x="40" y="88.0" font-size="28" font-weight="700" fill="#1C1C2E" text-anchor="start" >La boucle de l'agent</text>
<text x="40" y="114.0" font-size="14" font-weight="400" fill="#7A7A8C" text-anchor="start" >Observer, décider, agir, vérifier — avec des garde-fous aux points de sortie.</text>
<circle cx="600" cy="400" r="270" fill="none" stroke="#DADAE3" stroke-width="1.2"/>
<path d="M671.9 213.4 A200 200 0 0 1 786.6 328.1" fill="none" stroke="#4E4EEA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<path d="M786.6 471.9 A200 200 0 0 1 671.9 586.6" fill="none" stroke="#4E4EEA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<path d="M528.1 586.6 A200 200 0 0 1 413.4 471.9" fill="none" stroke="#4E4EEA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<path d="M413.4 328.1 A200 200 0 0 1 528.1 213.4" fill="none" stroke="#4E4EEA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<circle cx="600.0" cy="200.0" r="52" fill="#4E4EEA" stroke="#4E4EEA" stroke-width="2.5"/>
<text x="600.0" y="202.0" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Observer</text>
<text x="600.0" y="219.0" font-size="9.5" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.85">lit le contexte</text>
<circle cx="800.0" cy="400.0" r="52" fill="#4E4EEA" stroke="#4E4EEA" stroke-width="2.5"/>
<text x="800.0" y="402.0" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Décider</text>
<text x="800.0" y="419.0" font-size="9.5" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.85">choisit l'action</text>
<circle cx="600.0" cy="600.0" r="52" fill="#4E4EEA" stroke="#4E4EEA" stroke-width="2.5"/>
<text x="600.0" y="602.0" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Agir</text>
<text x="600.0" y="619.0" font-size="9.5" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.85">appelle un outil</text>
<circle cx="400.0" cy="400.0" r="52" fill="#F9C623" stroke="#E0AA00" stroke-width="2.5"/>
<text x="400.0" y="402.0" font-size="16" font-weight="700" fill="#1C1C2E" text-anchor="middle" >Vérifier</text>
<text x="400.0" y="419.0" font-size="9.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" opacity="0.85">contrôle</text>
<circle cx="600" cy="400" r="88" fill="#FFFFFF" stroke="#4E4EEA" stroke-width="2"/>
<text x="600" y="394.0" font-size="15" font-weight="700" fill="#4E4EEA" text-anchor="middle" >OBJECTIF</text>
<text x="600" y="414.0" font-size="11" font-weight="400" fill="#7A7A8C" text-anchor="middle" >fixé par l'humain</text>
<path d="M755.4 258.6 C823.2 258.6 823.2 226 905 226" fill="none" stroke="#E5484D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#a-coral)"/>
<circle cx="741.4" cy="258.6" r="13" fill="#E5484D" stroke="#FFFFFF" stroke-width="3"/>
<text x="741.4" y="263.1" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" >1</text>
<rect x="905" y="170" width="255" height="118" rx="14" fill="#FDECEC" stroke="#E5484D" stroke-width="1.5" />
<text x="923" y="198.0" font-size="10.5" font-weight="700" fill="#E5484D" text-anchor="start" >Garde-fou 1</text>
<text x="923" y="220.0" font-size="15" font-weight="700" fill="#1C1C2E" text-anchor="start" >Filtrer les entrées</text>
<text x="923" y="240.0" font-size="11" font-weight="400" fill="#7A7A8C" text-anchor="start" >Ignorer ce qui est hors</text>
<text x="923" y="255.0" font-size="11" font-weight="400" fill="#7A7A8C" text-anchor="start" >périmètre ou sensible.</text>
<text x="923" y="275.0" font-size="11" font-weight="600" fill="#E5484D" text-anchor="start" >Sortie : donnée écartée</text>
<path d="M755.4 541.4 C823.2 541.4 823.2 516 905 516" fill="none" stroke="#E5484D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#a-coral)"/>
<circle cx="741.4" cy="541.4" r="13" fill="#E5484D" stroke="#FFFFFF" stroke-width="3"/>
<text x="741.4" y="545.9" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" >2</text>
<rect x="905" y="460" width="255" height="118" rx="14" fill="#FDECEC" stroke="#E5484D" stroke-width="1.5" />
<text x="923" y="488.0" font-size="10.5" font-weight="700" fill="#E5484D" text-anchor="start" >Garde-fou 2</text>
<text x="923" y="510.0" font-size="15" font-weight="700" fill="#1C1C2E" text-anchor="start" >Valider avant d'agir</text>
<text x="923" y="530.0" font-size="11" font-weight="400" fill="#7A7A8C" text-anchor="start" >Droits limités et accord humain</text>
<text x="923" y="545.0" font-size="11" font-weight="400" fill="#7A7A8C" text-anchor="start" >pour les actions sensibles.</text>
<text x="923" y="565.0" font-size="11" font-weight="600" fill="#E5484D" text-anchor="start" >Sortie : escalade à un humain</text>
<path d="M444.6 541.4 C376.8 541.4 376.8 516 295 516" fill="none" stroke="#E5484D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#a-coral)"/>
<circle cx="458.6" cy="541.4" r="13" fill="#E5484D" stroke="#FFFFFF" stroke-width="3"/>
<text x="458.6" y="545.9" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" >3</text>
<rect x="40" y="460" width="255" height="118" rx="14" fill="#FDECEC" stroke="#E5484D" stroke-width="1.5" />
<text x="58" y="488.0" font-size="10.5" font-weight="700" fill="#E5484D" text-anchor="start" >Garde-fou 3</text>
<text x="58" y="510.0" font-size="15" font-weight="700" fill="#1C1C2E" text-anchor="start" >Plafonner la boucle</text>
<text x="58" y="530.0" font-size="11" font-weight="400" fill="#7A7A8C" text-anchor="start" >Nombre d'itérations et budget</text>
<text x="58" y="545.0" font-size="11" font-weight="400" fill="#7A7A8C" text-anchor="start" >maximum.</text>
<text x="58" y="565.0" font-size="11" font-weight="600" fill="#E5484D" text-anchor="start" >Sortie : arrêt propre</text>
<path d="M444.6 258.6 C376.8 258.6 376.8 226 295 226" fill="none" stroke="#E5484D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#a-coral)"/>
<circle cx="458.6" cy="258.6" r="13" fill="#E5484D" stroke="#FFFFFF" stroke-width="3"/>
<text x="458.6" y="263.1" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" >4</text>
<rect x="40" y="170" width="255" height="118" rx="14" fill="#FDECEC" stroke="#E5484D" stroke-width="1.5" />
<text x="58" y="198.0" font-size="10.5" font-weight="700" fill="#E5484D" text-anchor="start" >Garde-fou 4</text>
<text x="58" y="220.0" font-size="15" font-weight="700" fill="#1C1C2E" text-anchor="start" >Objectif atteint ?</text>
<text x="58" y="240.0" font-size="11" font-weight="400" fill="#7A7A8C" text-anchor="start" >Critère de succès clair pour</text>
<text x="58" y="255.0" font-size="11" font-weight="400" fill="#7A7A8C" text-anchor="start" >sortir.</text>
<text x="58" y="275.0" font-size="11" font-weight="600" fill="#E5484D" text-anchor="start" >Sortie : fin de la boucle</text>
</svg>
