<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Mémoire à court terme et base de connaissances</title>
<desc id="d">Deux blocs distincts : le contexte de la conversation en cours, relu à chaque tour par l'agent, et les documents de référence externes, interrogés à la demande par requête.</desc>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#4E4EEA"/></marker><marker id="a-yel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#E0AA00"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#1C1C2E"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#7A7A8C"/></marker><marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#E5484D"/></marker><marker id="a-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#2F2FB5"/></marker></defs>
<rect width="1200" height="700" fill="#FBFBF8"/>
<rect x="40" y="28" width="36.4" height="26" rx="13.0" fill="#1C1C2E" stroke="none" stroke-width="0" />
<text x="58.2" y="45.2" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" >M5</text>
<text x="40" y="88.0" font-size="28" font-weight="700" fill="#1C1C2E" text-anchor="start" >Mémoire court terme vs base de connaissances</text>
<text x="40" y="114.0" font-size="14" font-weight="400" fill="#7A7A8C" text-anchor="start" >Ce que l'agent garde en tête, et ce qu'il va chercher.</text>
<rect x="40" y="140" width="390" height="500" rx="20" fill="#FFFFFF" stroke="#DADAE3" stroke-width="1.5" />
<rect x="40" y="140" width="390" height="54" rx="20" fill="#ECECFD" stroke="#4E4EEA" stroke-width="1.5" />
<rect x="40" y="170" width="390" height="24" rx="0" fill="#ECECFD" stroke="none" stroke-width="1.5" />
<path d="M40 194 H430" fill="none" stroke="#4E4EEA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="62" y="174.0" font-size="16" font-weight="700" fill="#4E4EEA" text-anchor="start" >Mémoire à court terme</text>
<text x="62" y="224.0" font-size="12.5" font-weight="600" fill="#1C1C2E" text-anchor="start" >Contexte de la conversation en cours</text>
<rect x="62" y="242" width="220" height="44" rx="14" fill="#FBFBF8" stroke="#DADAE3" stroke-width="1.5" />
<text x="76" y="262.0" font-size="11.5" font-weight="400" fill="#1C1C2E" text-anchor="start" >Bonjour, j'ai une demande</text>
<text x="76" y="277.0" font-size="11.5" font-weight="400" fill="#1C1C2E" text-anchor="start" >urgente de Mme Dupont.</text>
<rect x="158" y="296" width="250" height="44" rx="14" fill="#4E4EEA" stroke="none" stroke-width="1.5" />
<text x="172" y="316.0" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="start" >Compris. Quel est l'objet</text>
<text x="172" y="331.0" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="start" >de sa demande ?</text>
<rect x="62" y="350" width="220" height="44" rx="14" fill="#FBFBF8" stroke="#DADAE3" stroke-width="1.5" />
<text x="76" y="370.0" font-size="11.5" font-weight="400" fill="#1C1C2E" text-anchor="start" >Une facture à corriger</text>
<text x="76" y="385.0" font-size="11.5" font-weight="400" fill="#1C1C2E" text-anchor="start" >avant vendredi.</text>
<path d="M64 432 l4 4 l8 -9" fill="none" stroke="#4E4EEA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="440.0" font-size="12.5" font-weight="500" fill="#1C1C2E" text-anchor="start" >Tout est relu à chaque tour</text>
<path d="M64 466 l4 4 l8 -9" fill="none" stroke="#4E4EEA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="474.0" font-size="12.5" font-weight="500" fill="#1C1C2E" text-anchor="start" >Taille limitée (fenêtre de contexte)</text>
<path d="M64 500 l4 4 l8 -9" fill="none" stroke="#4E4EEA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="508.0" font-size="12.5" font-weight="500" fill="#1C1C2E" text-anchor="start" >S'efface en fin de session</text>
<text x="62" y="566.0" font-size="11.5" font-weight="700" fill="#7A7A8C" text-anchor="start" >À utiliser pour :</text>
<text x="62" y="586.0" font-size="11.5" font-weight="400" fill="#7A7A8C" text-anchor="start" >le fil de l'échange, les choix déjà</text>
<text x="62" y="603.0" font-size="11.5" font-weight="400" fill="#7A7A8C" text-anchor="start" >faits, ce que l'utilisateur vient de dire.</text>
<rect x="770" y="140" width="390" height="500" rx="20" fill="#FFFFFF" stroke="#DADAE3" stroke-width="1.5" />
<rect x="770" y="140" width="390" height="54" rx="20" fill="#FEF4CF" stroke="#E0AA00" stroke-width="1.5" />
<rect x="770" y="170" width="390" height="24" rx="0" fill="#FEF4CF" stroke="none" stroke-width="1.5" />
<path d="M770 194 H1160" fill="none" stroke="#E0AA00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="792" y="174.0" font-size="16" font-weight="700" fill="#8A6500" text-anchor="start" >Base de connaissances</text>
<text x="792" y="224.0" font-size="12.5" font-weight="600" fill="#1C1C2E" text-anchor="start" >Documents de référence externes</text>
<rect x="792" y="242" width="346" height="38" rx="10" fill="#FBFBF8" stroke="#DADAE3" stroke-width="1.5" />
<rect x="804" y="251" width="16" height="20" rx="3" fill="#FFFFFF" stroke="#E0AA00" stroke-width="1.5" />
<text x="832" y="266.0" font-size="12.5" font-weight="500" fill="#1C1C2E" text-anchor="start" >Procédures.pdf</text>
<rect x="792" y="286" width="346" height="38" rx="10" fill="#FBFBF8" stroke="#DADAE3" stroke-width="1.5" />
<rect x="804" y="295" width="16" height="20" rx="3" fill="#FFFFFF" stroke="#E0AA00" stroke-width="1.5" />
<text x="832" y="310.0" font-size="12.5" font-weight="500" fill="#1C1C2E" text-anchor="start" >FAQ clients.docx</text>
<rect x="792" y="330" width="346" height="38" rx="10" fill="#FBFBF8" stroke="#DADAE3" stroke-width="1.5" />
<rect x="804" y="339" width="16" height="20" rx="3" fill="#FFFFFF" stroke="#E0AA00" stroke-width="1.5" />
<text x="832" y="354.0" font-size="12.5" font-weight="500" fill="#1C1C2E" text-anchor="start" >Tarifs 2026.xlsx</text>
<text x="792" y="392.0" font-size="14" font-weight="700" fill="#7A7A8C" text-anchor="start" >…</text>
<path d="M794 432 l4 4 l8 -9" fill="none" stroke="#B88A00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="818" y="440.0" font-size="12.5" font-weight="500" fill="#1C1C2E" text-anchor="start" >Persiste et se met à jour</text>
<path d="M794 466 l4 4 l8 -9" fill="none" stroke="#B88A00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="818" y="474.0" font-size="12.5" font-weight="500" fill="#1C1C2E" text-anchor="start" >Volume quasi illimité</text>
<path d="M794 500 l4 4 l8 -9" fill="none" stroke="#B88A00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="818" y="508.0" font-size="12.5" font-weight="500" fill="#1C1C2E" text-anchor="start" >Interrogée à la demande</text>
<text x="792" y="566.0" font-size="11.5" font-weight="700" fill="#7A7A8C" text-anchor="start" >À utiliser pour :</text>
<text x="792" y="586.0" font-size="11.5" font-weight="400" fill="#7A7A8C" text-anchor="start" >les règles métier, les tarifs, les</text>
<text x="792" y="603.0" font-size="11.5" font-weight="400" fill="#7A7A8C" text-anchor="start" >procédures — ce qui ne change pas à chaque échange.</text>
<circle cx="600" cy="390" r="84" fill="#4E4EEA" stroke="#2F2FB5" stroke-width="3"/>
<text x="600" y="386.0" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" >AGENT</text>
<text x="600" y="408.0" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.9">répond à la demande</text>
<path d="M434 360 L512 372" fill="none" stroke="#4E4EEA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<text x="476" y="338.0" font-size="10.5" font-weight="600" fill="#4E4EEA" text-anchor="middle" >tout le contexte</text>
<text x="476" y="351.0" font-size="10.5" font-weight="600" fill="#4E4EEA" text-anchor="middle" >à chaque tour</text>
<path d="M680 360 C710 340 730 330 766 330" fill="none" stroke="#B88A00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#a-yel)"/>
<text x="722" y="316.0" font-size="11" font-weight="600" fill="#B88A00" text-anchor="middle" >requête</text>
<path d="M766 400 C730 400 710 410 682 420" fill="none" stroke="#B88A00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-yel)"/>
<text x="724" y="440.0" font-size="11" font-weight="600" fill="#B88A00" text-anchor="middle" >extraits utiles</text>
<path d="M600 478 V560" fill="none" stroke="#1C1C2E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)"/>
<rect x="530" y="566" width="140" height="40" rx="20" fill="#1C1C2E" stroke="none" stroke-width="1.5" />
<text x="600" y="591.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Réponse</text>
<text x="600" y="670.0" font-size="12" font-weight="500" fill="#7A7A8C" text-anchor="middle" >Mémoire : on relit tout.  Base : on pioche seulement le passage utile.</text>
</svg>
