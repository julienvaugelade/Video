<text x="58.2" y="45.2" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" >M5</text>
<text x="40" y="88.0" font-size="28" font-weight="700" fill="#1C1C2E" text-anchor="start" >Orchestration multi-agents</text>
<text x="40" y="114.0" font-size="14" font-weight="400" fill="#7A7A8C" text-anchor="start" >Un chef d'orchestre, trois spécialistes.</text>
<rect x="60" y="160" width="200" height="64" rx="32" fill="#FBFBF8" stroke="#DADAE3" stroke-width="2" />
<text x="160" y="190.0" font-size="15" font-weight="700" fill="#1C1C2E" text-anchor="middle" >Demande</text>
<text x="160" y="208.0" font-size="11" font-weight="400" fill="#7A7A8C" text-anchor="middle" >d'Emma Rousseau</text>
<rect x="880" y="160" width="200" height="64" rx="32" fill="#1C1C2E" stroke="none" stroke-width="1.5" />
<text x="980" y="190.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Réponse finale</text>
<text x="980" y="208.0" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.8">assemblée</text>
<rect x="420" y="140" width="280" height="104" rx="22" fill="#4E4EEA" stroke="#2F2FB5" stroke-width="3" />
<text x="560" y="182.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" >AGENT ORCHESTRATEUR</text>
<text x="560" y="204.0" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.9">comprend, découpe, délègue,</text>
<text x="560" y="221.0" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.9">contrôle et assemble</text>
